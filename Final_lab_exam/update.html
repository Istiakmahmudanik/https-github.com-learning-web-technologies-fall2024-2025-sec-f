<!-- Employee List -->
<h2>Employee List</h2>
<input type="text" id="search" placeholder="Search Employees">
<ul id="employeeList"></ul>

<!-- Update Employee Form -->
<h2>Update Employee</h2>
<form id="updateEmployeeForm" style="display: none;">
    <input type="hidden" id="updateId">
    <input type="text" id="updateName" placeholder="Name" required>
    <input type="text" id="updateContactNo" placeholder="Contact No" required>
    <input type="text" id="updateUsername" placeholder="Username" required>
    <button type="submit">Update</button>
</form>
