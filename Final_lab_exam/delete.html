<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Employee</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Delete Employee</h1>

    <!-- Search Input -->
    <input type="text" id="search" placeholder="Search Employee">
    <ul id="employeeList"></ul>

    <script>
        // Function to load employees
        function loadEmployees(query = "") {
            // AJAX GET request to fetch employees
            $.ajax({
                url: "fetch_employees.php", // Backend script to fetch employees
                type: "GET",
                data: { query: query }, // Send query parameter
                success: function (response) {
                    // Parse the response
                    const employees = JSON.parse(response);

                    // Clear the employee list
                    $("#employeeList").empty();

                    if (employees.length > 0) {
                        // Populate the list with employee data
                        employees.forEach(employee => {
                            $("#employeeList").append(`
                                <li>
                                    ${employee.name} (${employee.username}) - ${employee.contact_no}
                                    <button class="deleteBtn" data-id="${employee.id}">Delete</button>
                                </li>
                            `);
                        });
                    } else {
                        // Show message if no employees found
                        $("#employeeList").append("<li>No employees found</li>");
                    }
                },
                error: function () {
                    // Handle errors
                    alert("Error loading employees!");
                }
            });
        }

        // Load employees on page load
        loadEmployees();

        // Search input event
        $("#search").on("input", function () {
            const query = $(this).val(); // Get search input
            loadEmployees(query); // Fetch filtered employees
        });

        // Handle delete action
        $(document).on("click", ".deleteBtn", function () {
            const id = $(this).data("id");

            if (confirm("Are you sure you want to delete this employee?")) {
                // Send POST request to delete.php
                $.ajax({
                    url: "delete.php",
                    type: "POST",
                    data: { id: id },
                    success: function (response) {
                        alert(response); // Show success message
                        loadEmployees(); // Reload the employee list
                    },
                    error: function () {
                        alert("Error deleting employee!");
                    }
                });
            }
        });
    </script>
</body>
</html>
